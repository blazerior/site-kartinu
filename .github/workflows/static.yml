name: Update paintings

on:
  repository_dispatch:
    types: [paintings-update]

permissions:
  contents: write

concurrency:
  group: paintings
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install jinja2==3.1.6

      - name: Apply change
        env:
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: python scripts/admin/apply_change.py

      - name: Generate site from paintings.json
        run: python scripts/admin/generate.py

      - name: FTP deploy
        env:
          FTP_HOST: 77.222.40.84
          FTP_PORT: '21'
          FTP_USER: ekater3com
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
          FTP_ROOT: /home/e/ekater3com/public_html
        run: python scripts/admin/ftp_deploy.py

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "Auto: update paintings ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git push
